name: Test free offline English quality
on:
  push:
    branches: [test/free-offline-english]
permissions:
  contents: read
concurrency:
  group: translation-quality
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node scripts/build.mjs && node scripts/prepare-english.mjs
      - name: Download verified official CPU runtime and model
        run: bash scripts/setup-translation.sh
      - name: Translate public financial-risk samples
        run: python3 scripts/translate-english.py --sample
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-english-quality-sample
          path: .translation/quality-sample.json
          retention-days: 1
          if-no-files-found: warn
